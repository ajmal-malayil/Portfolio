<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <defs>
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
        </linearGradient>
        <!-- Neural Network Connection Effect -->
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- Main Background -->
    <rect width="100%" height="100%" fill="url(#bgGradient)" />

    <!-- AI Circle -->
    <circle cx="250" cy="300" r="100" fill="#4CAF50" opacity="0.8" filter="url(#glow)" />
    <text x="250" y="310" text-anchor="middle" fill="white" font-family="Arial" font-size="40" font-weight="bold">AI</text>

    <!-- ML Circle -->
    <circle cx="400" cy="200" r="100" fill="#2196F3" opacity="0.8" filter="url(#glow)" />
    <text x="400" y="210" text-anchor="middle" fill="white" font-family="Arial" font-size="40" font-weight="bold">ML</text>

    <!-- LLM Circle -->
    <circle cx="550" cy="300" r="100" fill="#9C27B0" opacity="0.8" filter="url(#glow)" />
    <text x="550" y="310" text-anchor="middle" fill="white" font-family="Arial" font-size="40" font-weight="bold">LLM</text>

    <!-- Interconnecting Lines -->
    <g stroke-width="3" filter="url(#glow)">
        <line x1="325" y1="250" x2="475" y2="250" stroke="#FFF" opacity="0.5" />
        <line x1="475" y1="250" x2="500" y2="300" stroke="#FFF" opacity="0.5" />
        <line x1="325" y1="250" x2="300" y2="300" stroke="#FFF" opacity="0.5" />
    </g>

    <!-- Binary/Code Background Elements -->
    <g fill="#ffffff" opacity="0.1" font-family="monospace" font-size="14">
        <text x="100" y="100">01001100 01001100 01001101</text>
        <text x="500" y="150">def train_model():</text>
        <text x="200" y="450">class AIModel(torch.nn.Module):</text>
        <text x="600" y="400">import tensorflow as tf</text>
        <text x="150" y="500">prompt = "Generate..."</text>
    </g>

    <!-- Floating Particles -->
    <g fill="#ffffff" opacity="0.5">
        <circle cx="150" cy="150" r="2" />
        <circle cx="650" cy="450" r="2" />
        <circle cx="350" cy="500" r="2" />
        <circle cx="700" cy="200" r="2" />
        <circle cx="200" cy="400" r="2" />
    </g>
</svg>